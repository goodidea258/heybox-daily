name: Build All-in-One Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build official runner base stage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          load: true
          tags: heybox-runner-base:local

      - name: Build and push All-in-One image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.allinone
          build-contexts: |
            heybox-runner-base=docker-image://heybox-runner-base:local
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/heybox-daily-allinone:latest
            ghcr.io/${{ github.repository_owner }}/heybox-daily-allinone:${{ github.sha }}
